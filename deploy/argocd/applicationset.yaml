apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: voice-detect-apps
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - cluster: https://kubernetes.default.svc
        env: dev
      - cluster: https://kubernetes.default.svc
        env: staging
      - cluster: https://kubernetes.default.svc
        env: prod
  template:
    metadata:
      name: '{{env}}-voice-detect'
    spec:
      project: voice-detect
      source:
        repoURL: https://github.com/my-org/voice-detect.git
        targetRevision: HEAD
        path: 'deploy/envs/{{env}}'
      destination:
        server: '{{cluster}}'
        namespace: '{{env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
