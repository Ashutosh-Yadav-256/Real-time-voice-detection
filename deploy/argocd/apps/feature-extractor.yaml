apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: feature-extractor
  namespace: argocd
spec:
  project: voice-detect
  source:
    repoURL: https://github.com/my-org/voice-detect.git
    targetRevision: HEAD
    path: deploy/envs/dev
    helm:
      valueFiles:
      - feature-extractor-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
