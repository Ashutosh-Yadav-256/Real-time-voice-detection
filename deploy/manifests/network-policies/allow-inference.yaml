apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inference
  namespace: voice-inference
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: voice-processing
    ports:
    - protocol: TCP
      port: 8001
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
