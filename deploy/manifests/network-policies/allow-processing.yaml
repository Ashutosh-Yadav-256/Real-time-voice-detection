apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-processing
  namespace: voice-processing
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: voice-inference
